name: Update Cozy Studio Profile

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'  # Daily; GitHub schedules can be delayed.
  push:
    paths:
      - 'scripts/generate.py'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: cozy-studio-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate accurate GitHub charts and cards
        run: python scripts/generate.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: Bijay-Thakur
      - name: Commit refreshed images only if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh public GitHub stats [skip ci]"
            git push
          fi
