name: Refresh GitHub Profile Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    paths:
      - 'scripts/editorial_profile.py'
      - 'scripts/test_editorial_profile.py'
      - 'scripts/github_data.py'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: editorial-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python and profile metrics
        run: |
          python -m compileall -q scripts/github_data.py scripts/editorial_profile.py scripts/test_editorial_profile.py
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_editorial_profile.py' -v
      - name: Generate verified activity data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: Bijay-Thakur
        run: python scripts/editorial_profile.py
      - name: Commit updated activity only if data changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/editorial-activity.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update verified GitHub profile metrics [skip ci]'
            git push
          fi