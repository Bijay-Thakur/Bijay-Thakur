name: Update Cozy Studio Profile
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile.yml"
permissions:
  contents: write
concurrency:
  group: cozy-studio-stats-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render verified GitHub metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: Bijay-Thakur
        run: python scripts/generate.py
      - name: Save refreshed graphics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Cozy Studio graphics [skip ci]"
            git push
          fi
